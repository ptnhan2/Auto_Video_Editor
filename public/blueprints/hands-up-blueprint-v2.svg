<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid background for clear silhouette -->
  <rect width="1024" height="1024" fill="white"/>
  
  <!-- Master Blueprint: FULL BODY STANDING T-POSE -->
  <!-- HEAD (Centered) -->
  <circle cx="512" cy="120" r="60" stroke="black" stroke-width="8" fill="#EEEEEE"/>

  <!-- TORSO (Centered, connected to legs) -->
  <rect x="452" y="180" width="120" height="300" stroke="black" stroke-width="8" fill="#DDDDDD"/>

  <!-- LEFT ARM (Raised Up 45 degrees) -->
  <line x1="452" y1="210" x2="300" y2="50" stroke="red" stroke-width="15" stroke-linecap="round"/>
  
  <!-- RIGHT ARM (Raised Up 45 degrees) -->
  <line x1="572" y1="210" x2="724" y2="50" stroke="red" stroke-width="15" stroke-linecap="round"/>

  <!-- LEFT LEG (Clearly visible down to feet) -->
  <line x1="472" y1="480" x2="472" y2="950" stroke="black" stroke-width="12" stroke-linecap="round"/>
  <rect x="450" y="950" width="44" height="20" fill="black"/> <!-- Left Foot Anchor -->

  <!-- RIGHT LEG (Clearly visible down to feet) -->
  <line x1="552" y1="480" x2="552" y2="950" stroke="black" stroke-width="12" stroke-linecap="round"/>
  <rect x="530" y="950" width="44" height="20" fill="black"/> <!-- Right Foot Anchor -->
</svg>
