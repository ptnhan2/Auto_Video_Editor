name: Gatekeeper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: 🐍 Python Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Sử dụng ruff action cực nhanh để kiểm tra lỗi Python
      - name: Lint Python Code with Ruff
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.1.12"
          args: "check ."

  typescript-lint:
    name: ⚛️ TypeScript Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      # Sync assets là bước predev/prebuild cần thiết của project
      - name: Sync Asset Registry
        run: npm run sync-assets
        
      - name: TypeCheck (No Emit)
        run: npx tsc --noEmit
